[package]
name = "rules-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `com/guocheng/mediapocket/rules/`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
jni = "0.21"
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.2"
regex = "1.13.2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
